<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 第七章最後四選一之前：明在筆電上算給她看「這三個禮拜，妳最常找誰」。
     讀 affC／affM／affS（miniGameReadVars 要列這三個），三角形三個角是晨、明、詩，金色光點照三人的比重落點；
     三人越平均，光點越靠近中間。按「好」送 larch:complete，result 是 C／M／S／even（最高的人，或三人接近平均）。
     直接開這個檔（沒有 Larch）時用示範數字。 -->
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap");
:root { color-scheme: normal; --deep:#0b1330; --blue:#8aa2ea; --ink:#eef1fb; --dim:rgba(238,241,251,.62); --gold:#e9cf9a;
  --c:#c8d45a; --m:#8aa2ea; --s:#cf5a6c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { color: var(--ink); font-family: "Noto Serif TC", "Songti TC", serif;
  background: radial-gradient(80vmax 60vmax at 50% 40%, #16224c, var(--deep) 60%, #060a1a); }
/* 明的介面：深藍空間、浮動的光點、內緣一圈細亮線 */
body::before { content: ""; position: fixed; inset: 14px; border: 1px solid rgba(138,162,234,.35); border-radius: 10px; pointer-events: none; box-shadow: inset 0 0 40px rgba(138,162,234,.12); }
.motes { position: fixed; inset: 0; pointer-events: none; background-image: radial-gradient(rgba(180,200,255,.5) 1px, transparent 1.5px); background-size: 90px 90px; opacity: .25; }
.wrap { position: relative; height: 100%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; padding: 6vh 6vw 5vh; }
.say { text-align: center; }
.say small { display: block; color: var(--blue); font-size: clamp(12px, 1vw, 14px); letter-spacing: .4em; margin-bottom: 8px; }
.say p { margin: 0; font-size: clamp(17px, 1.7vw, 24px); letter-spacing: .1em; line-height: 1.7; text-shadow: 0 2px 14px rgba(0,0,0,.6); }
svg { width: min(78vmin, 620px); height: auto; overflow: visible; align-self: center; }
.edge { fill: none; stroke: rgba(238,241,251,.22); stroke-width: 1.2; }
.fillT { fill: rgba(138,162,234,.06); }
.grid { fill: none; stroke: rgba(238,241,251,.08); stroke-width: 1; }
.vx circle { transition: r 1.2s ease, opacity 1.2s; }
.vx text { font-size: 22px; font-weight: 600; letter-spacing: .1em; text-anchor: middle; }
.vx .n { font-size: 13px; font-weight: 400; fill: var(--dim); letter-spacing: .08em; }
#dot { fill: #fff6df; filter: drop-shadow(0 0 10px var(--gold)) drop-shadow(0 0 3px #fff); }
#trail { fill: none; stroke: var(--gold); stroke-width: 1.4; stroke-dasharray: 2 6; opacity: .6; }
.foot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.foot p { margin: 0; color: var(--dim); font-size: clamp(14px, 1.2vw, 17px); letter-spacing: .12em; min-height: 1.8em; text-align: center; transition: opacity .6s; }
button { font: inherit; font-size: clamp(15px, 1.2vw, 18px); letter-spacing: .4em; padding: 10px 26px 10px 32px; color: var(--deep); background: var(--gold); border: 0; border-radius: 2px; cursor: pointer; opacity: 0; transition: opacity .6s; }
button.on { opacity: 1; }
button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { .vx circle { transition: none; } }
</style>
<div class="motes"></div>
<div class="wrap">
  <div class="say"><small>明</small><p>我算了一下。這三個禮拜，妳最常找誰。</p></div>
  <svg viewBox="-60 -40 720 640" aria-label="三角圖：晨、明、詩三個角，金色光點是她這段時間的落點">
    <polygon class="fillT" points="300,40 40,490 560,490"/>
    <polygon class="grid" points="300,190 170,415 430,415"/>
    <polygon class="grid" points="300,340 235,452 365,452"/>
    <polygon class="edge" points="300,40 40,490 560,490"/>
    <path id="trail"/>
    <g class="vx" id="vM"><circle cx="300" cy="40" r="10" fill="var(--m)"/><text x="300" y="-2" fill="var(--m)">明</text><text class="n" x="300" y="-32" id="nM"></text></g>
    <g class="vx" id="vC"><circle cx="40" cy="490" r="10" fill="var(--c)"/><text x="40" y="540" fill="var(--c)">晨</text><text class="n" x="40" y="566" id="nC"></text></g>
    <g class="vx" id="vS"><circle cx="560" cy="490" r="10" fill="var(--s)"/><text x="560" y="540" fill="var(--s)">詩</text><text class="n" x="560" y="566" id="nS"></text></g>
    <circle id="dot" cx="300" cy="340" r="9"/>
  </svg>
  <div class="foot"><p id="line"></p><button id="ok">好</button></div>
</div>
<script>
(function () {
  var V = { C: [40, 490], M: [300, 40], S: [560, 490] }, CEN = [300, 340];
  var NAME = { C: "晨", M: "明", S: "詩" };
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches, started = false, result = "even";
  function $(id) { return document.getElementById(id); }
  function show(a) {
    if (started) return; started = true;
    var c = Math.max(0, +a.affC || 0), m = Math.max(0, +a.affM || 0), s = Math.max(0, +a.affS || 0), t = c + m + s;
    $("nC").textContent = "找晨 " + c + " 次"; $("nM").textContent = "找明 " + m + " 次"; $("nS").textContent = "找詩 " + s + " 次";
    var w = t ? { C: c / t, M: m / t, S: s / t } : { C: 1 / 3, M: 1 / 3, S: 1 / 3 };
    var tx = w.C * V.C[0] + w.M * V.M[0] + w.S * V.S[0], ty = w.C * V.C[1] + w.M * V.M[1] + w.S * V.S[1];
    // 最高的人；三人差距都在總數的 15% 以內算平均
    var top = Object.keys(w).sort(function (a, b) { return w[b] - w[a]; });
    var even = t === 0 || (w[top[0]] - w[top[2]]) <= 0.15;
    result = even ? "even" : top[0];
    ["C", "M", "S"].forEach(function (k) { var g = $("v" + k).querySelector("circle"); g.setAttribute("r", 8 + w[k] * 22); g.style.opacity = .55 + w[k]; });
    var dot = $("dot"), trail = $("trail"), T = still ? 0 : 2400, t0 = performance.now();
    (function step(now) { var k = T ? Math.min(1, (now - t0) / T) : 1, e = 1 - Math.pow(1 - k, 3);
      var x = CEN[0] + (tx - CEN[0]) * e, y = CEN[1] + (ty - CEN[1]) * e;
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); trail.setAttribute("d", "M" + CEN[0] + "," + CEN[1] + " L" + x + "," + y);
      if (k < 1) requestAnimationFrame(step); else done(); })(t0);
    function done() {
      $("line").textContent = even ? "……三個人差不多。這樣啊。" : "最多的是" + NAME[top[0]] + "。……我只是照實算出來而已。";
      var b = $("ok"); b.classList.add("on"); b.focus({ preventScroll: true });
    }
  }
  $("ok").onclick = function () { parent.postMessage({ type: "larch:complete", result: result, payload: {} }, "*"); };
  addEventListener("message", function (e) { var d = e.data || {}; if (d.type === "larch:init") show(d.variables || {}); });
  parent.postMessage({ type: "larch:ready" }, "*");
  // 直接開檔（不在 Larch 裡）時用示範數字：晨 3、明 2、詩 2
  if (parent === window) setTimeout(function () { show({ affC: 3, affM: 2, affS: 2 }); }, 300);
})();
</script>
</html>
